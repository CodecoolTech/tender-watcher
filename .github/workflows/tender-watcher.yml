name: Tender Watcher

# Weekly run: Monday 06:00 UTC = 08:00 Budapest (summer time, CEST).
# In winter (CET, UTC+1) this becomes 07:00 Budapest. "workflow_dispatch" also
# allows a manual start.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the updated dashboard + state can be pushed back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tender watcher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python tender_watcher.py

      - name: Commit updated data
        run: |
          git config user.name "tender-watcher-bot"
          git config user.email "actions@github.com"
          git add docs/ state/ digests/ || true
          git commit -m "Weekly tender watcher update ($(date -u +%Y-%m-%d))" || echo "No changes."
          git push || echo "Push skipped."
